apiVersion: v1
kind: Service
metadata:
  name: investment-agent
  namespace: investment-agent
  labels:
    app: investment-agent
spec:
  type: LoadBalancer
  selector:
    app: investment-agent
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Secret
metadata:
  name: siliconflow-secret
  namespace: investment-agent
type: Opaque
stringData:
  api-key: ${SILICONFLOW_API_KEY}
