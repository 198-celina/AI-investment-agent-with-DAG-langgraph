apiVersion: apps/v1
kind: Deployment
metadata:
  name: investment-agent
  namespace: investment-agent
  labels:
    app: investment-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: investment-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: investment-agent
    spec:
      containers:
      - name: investment-agent
        image: ${IMAGE_TAG}
        ports:
        - containerPort: 8000
        env:
        - name: SILICONFLOW_API_KEY
          valueFrom:
            secretKeyRef:
              name: siliconflow-secret
              key: api-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      imagePullSecrets:
      - name: ghcr-secret
