apiVersion: apps/v1
kind: Deployment
metadata:
  name: investment-agent
  namespace: investment-agent
  labels:
    app: investment-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: investment-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: investment-agent
    spec:
      containers:
      - name: investment-agent
        image: ${IMAGE_TAG}
        ports:
        - containerPort: 8000
        env:
        - name: SILICONFLOW_API_KEY
          valueFrom:
            secretKeyRef:
              name: siliconflow-secret
              key: api-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
      imagePullSecrets:
      - name: acr-secret
