name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  REGISTRY: crpi-ezuhd3zamor8pcyc.cn-shanghai.personal.cr.aliyuncs.com
  NAMESPACE: investment-agent
  IMAGE_NAME: investment-agent
  K8S_NAMESPACE: investment-agent

jobs:
  # Job 1: 单元测试
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt 2>&1 | tail -20

    - name: Run DAG tests (pure logic, no API needed)
      run: |
        echo "=== Running DAG tests ==="
        pytest tests/test_dag.py -v --tb=short

    - name: Run Intent tests (needs API key)
      env:
        SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      run: |
        echo "=== Running Intent tests ==="
        pytest tests/test_intent.py -v --tb=short || true

    - name: Run RAG tests (needs vectorstore)
      env:
        SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      run: |
        echo "=== Running RAG tests ==="
        pytest tests/test_rag.py -v --tb=short || true

  # Job 2: 构建 Docker 镜像 + 漏洞扫描
  build:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Alibaba Cloud Registry
      run: |
        echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.ALIYUN_USERNAME }}" --password-stdin

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

  # Job 3: 部署到 K8s（需要 K8s 集群配置）
  deploy:
    name: Deploy to K8s
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && vars.K8S_ENABLED == 'true'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Configure K8s context
      env:
        KUBECONFIG_DATA: ${{ secrets.K8S_KUBECONFIG }}
        K8S_CONTEXT_NAME: ${{ secrets.K8S_CONTEXT }}
      run: |
        mkdir -p $HOME/.kube
        # Use printf to avoid shell interpretation of backticks/special chars
        printf '%s\n' "$KUBECONFIG_DATA" > $HOME/.kube/config
        # Remove any backticks from server URLs (copy-paste artifact)
        sed -i 's/`//g' $HOME/.kube/config
        chmod 600 $HOME/.kube/config
        kubectl config use-context "${K8S_CONTEXT_NAME}"
        kubectl cluster-info

    - name: Deploy to K8s (Rolling Update)
      run: |
        export IMAGE_TAG="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest"
        envsubst < k8s/deployment.yaml | kubectl apply -f -
        kubectl apply -f k8s/service.yaml
        kubectl rollout status deployment/investment-agent -n ${{ env.K8S_NAMESPACE }} --timeout=300s

    - name: Run smoke tests
      id: smoke
      run: |
        SERVICE_URL=$(kubectl get service investment-agent -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        sleep 30
        python scripts/smoke_test.py --url "http://${SERVICE_URL}:8000"

    - name: Rollback on failure
      if: failure() && steps.smoke.outcome == 'failure'
      run: |
        echo "Smoke test failed, rolling back..."
        kubectl rollout undo deployment/investment-agent -n ${{ env.K8S_NAMESPACE }}
        kubectl rollout status deployment/investment-agent -n ${{ env.K8S_NAMESPACE }} --timeout=300s
        echo "Rollback completed"
