name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  REGISTRY: crpi-ezuhd3zamor8pcyc.cn-shanghai.personal.cr.aliyuncs.com
  NAMESPACE: investment-agent
  IMAGE_NAME: investment-agent
  K8S_NAMESPACE: investment-agent

jobs:
  # Job 1: 单元测试
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt 2>&1 | tail -20

    - name: Run DAG tests (pure logic, no API needed)
      run: |
        echo "=== Running DAG tests ==="
        pytest tests/test_dag.py -v --tb=short

    - name: Run Intent tests (needs API key)
      env:
        SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      run: |
        echo "=== Running Intent tests ==="
        pytest tests/test_intent.py -v --tb=short || true

    - name: Run RAG tests (needs vectorstore)
      env:
        SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      run: |
        echo "=== Running RAG tests ==="
        pytest tests/test_rag.py -v --tb=short || true

  # Job 2: 构建 Docker 镜像 + 漏洞扫描
  build:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Alibaba Cloud Registry
      run: |
        echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.ALIYUN_USERNAME }}" --password-stdin

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

  # Job 3: 部署到 K8s（需要 K8s 集群配置）
  deploy:
    name: Deploy to K8s
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && vars.K8S_ENABLED == 'true'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Configure K8s context
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.K8S_KUBECONFIG_B64 }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
        kubectl config use-context "${{ secrets.K8S_CONTEXT }}"
        kubectl cluster-info
        kubectl get nodes

    - name: Deploy to K8s (Rolling Update)
      run: |
        # Create namespace if not exists
        kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

        # Create ACR image pull secret
        kubectl create secret docker-registry acr-secret \
          --namespace=${{ env.K8S_NAMESPACE }} \
          --docker-server=${{ env.REGISTRY }} \
          --docker-username="${{ secrets.ALIYUN_USERNAME }}" \
          --docker-password="${{ secrets.ALIYUN_PASSWORD }}" \
          --dry-run=client -o yaml | kubectl apply -f -

        # Create SiliconFlow API key secret
        kubectl create secret generic siliconflow-secret \
          --namespace=${{ env.K8S_NAMESPACE }} \
          --from-literal=api-key="${{ secrets.SILICONFLOW_API_KEY }}" \
          --dry-run=client -o yaml | kubectl apply -f -

        # Deploy with image tag substitution
        export IMAGE_TAG="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest"
        sed "s|\${IMAGE_TAG}|${IMAGE_TAG}|g" k8s/deployment.yaml | kubectl apply -f -
        sed "s|\${SILICONFLOW_API_KEY}|${{ secrets.SILICONFLOW_API_KEY }}|g" k8s/service.yaml | kubectl apply -f -

        # Debug: show pod status
        echo "=== Pod Status ==="
        kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide
        echo "=== Pod Events ==="
        kubectl get events -n ${{ env.K8S_NAMESPACE }} --sort-by='.lastTimestamp' | tail -20

        # Wait for rollout (10 minutes timeout)
        kubectl rollout status deployment/investment-agent -n ${{ env.K8S_NAMESPACE }} --timeout=600s

    - name: Run smoke tests
      id: smoke
      run: |
        SERVICE_URL=$(kubectl get service investment-agent -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        sleep 30
        python scripts/smoke_test.py --url "http://${SERVICE_URL}:8000"

    - name: Rollback on failure
      if: failure() && steps.smoke.outcome == 'failure'
      run: |
        echo "Smoke test failed, rolling back..."
        kubectl rollout undo deployment/investment-agent -n ${{ env.K8S_NAMESPACE }}
        kubectl rollout status deployment/investment-agent -n ${{ env.K8S_NAMESPACE }} --timeout=300s
        echo "Rollback completed"
